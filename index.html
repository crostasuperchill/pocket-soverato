<title>Pocket Soverato</title>
<style>
  :root { --ink:#33291f; --glass:rgba(255,255,255,.58); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }

  #c { display:block; width:100%; height:100%; touch-action:none; }
  #top { position:fixed; top:0; left:0; right:0; padding:calc(12px + env(safe-area-inset-top)) 16px 0;
    display:flex; justify-content:space-between; align-items:flex-start; pointer-events:none; z-index:5; }
  #title { text-shadow:0 1px 6px rgba(255,255,255,.85); font-size:14px; letter-spacing:.16em;
    text-transform:uppercase; color:var(--ink); opacity:.8; font-weight:700; }
  #sub { text-shadow:0 1px 5px rgba(255,255,255,.85); font-size:10.5px; letter-spacing:.03em;
    opacity:.5; margin-top:2px; font-weight:600; }
  #bar { position:fixed; right:12px; top:calc(50% - 92px); display:flex; flex-direction:column; gap:6px; z-index:6; }
  #bar button { all:unset; cursor:pointer; width:46px; height:46px; border-radius:14px;
    background:var(--glass); backdrop-filter:blur(14px) saturate(1.3);
    border:1px solid rgba(255,255,255,.65); box-shadow:0 6px 18px rgba(60,45,30,.14);
    display:grid; place-items:center; font-size:19px; transition:background .2s, transform .1s; }
  #bar button:active { transform:scale(.94); }
  #stick { position:fixed; left:18px; bottom:calc(20px + env(safe-area-inset-bottom)); width:118px; height:118px;
    border-radius:50%; background:rgba(255,255,255,.34); border:1px solid rgba(255,255,255,.6);
    backdrop-filter:blur(10px); z-index:7; touch-action:none; }
  #knob { position:absolute; left:50%; top:50%; width:54px; height:54px; margin:-27px 0 0 -27px;
    border-radius:50%; background:rgba(255,255,255,.86); box-shadow:0 3px 12px rgba(60,45,30,.22);
    transition:transform .09s ease-out; }
  #hint { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(150px + env(safe-area-inset-bottom));
    font-size:11px; color:var(--ink); opacity:.5; text-shadow:0 1px 4px rgba(255,255,255,.9);
    z-index:6; transition:opacity .8s; pointer-events:none; text-align:center; line-height:1.5; }
  body.night { --ink:#eae4d4; --glass:rgba(28,32,46,.58); }
  body.night #bar button { border-color:rgba(255,255,255,.14); }
  body.night #title, body.night #hint { text-shadow:0 1px 6px rgba(0,0,0,.6); }
  body.night #stick { background:rgba(30,34,48,.34); border-color:rgba(255,255,255,.18); }
  body.night #knob { background:rgba(240,235,220,.8); }
  #sun { font-size:18px; }
</style>

function ribbon(pts, width, yOff) {
  const n = pts.length, v = new Float32Array(n * 2 * 3);
  for (let i = 0; i < n; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    let dx = b[0] - a[0], dz = b[1] - a[1];
    const len = Math.hypot(dx, dz) || 1; dx /= len; dz /= len;
    const nx = -dz, nz = dx, hw = width / 2;
    const x0 = pts[i][0] + nx * hw, z0 = pts[i][1] + nz * hw;
    const x1 = pts[i][0] - nx * hw, z1 = pts[i][1] - nz * hw;
    v[i * 6] = x0; v[i * 6 + 1] = hSample(x0, z0) + yOff; v[i * 6 + 2] = z0;
    v[i * 6 + 3] = x1; v[i * 6 + 4] = hSample(x1, z1) + yOff; v[i * 6 + 5] = z1;
  }
  const ind = [];
  for (let i = 0; i < n - 1; i++) { const a = i * 2; ind.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(v, 3));
  g.setIndex(ind); g.computeVertexNormals();
  return g;
}

const cWorld = new THREE.Color();
function prepColor(hex, kind) {
  cWorld.set(hex);
  const hsl = {}; cWorld.getHSL(hsl);
  if (kind === 'roof') {
    // i colori dal satellite sono sporchi: li riporto a un tetto leggibile
    const hDeg = hsl.h * 360;
    const greenish = hDeg > 55 && hDeg < 200;
    if (greenish) {
      cWorld.setHSL(0.045, 0.34, 0.46);          // terracotta
    } else if (hsl.s < 0.14) {
      cWorld.setHSL(hsl.h, 0.05, Math.min(0.74, Math.max(0.44, hsl.l * 1.06)));  // lastrico
    } else {
      cWorld.setHSL(hsl.h, Math.min(0.58, hsl.s * 1.5), Math.min(0.66, Math.max(0.38, hsl.l * 1.02)));
    }
  }
  return cWorld.clone();
}
const shade = (hex, dl) => { const c = new THREE.Color(hex); const h = {}; c.getHSL(h); c.setHSL(h.h, h.s, Math.max(0.05, Math.min(0.95, h.l + dl))); return c; };

function area2(ring) {
  let a = 0;
  for (let i = 0; i < ring.length; i++) {
    const [x0, z0] = ring[i], [x1, z1] = ring[(i + 1) % ring.length];
    a += x0 * z1 - x1 * z0;
  }
  return a / 2;
}
function tint(g, c) {
  const n = g.attributes.position.count, arr = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { arr[i * 3] = c.r; arr[i * 3 + 1] = c.g; arr[i * 3 + 2] = c.b; }
  g.setAttribute('color', new THREE.BufferAttribute(arr, 3));
  return g;
}

// griglia di occupazione per le collisioni (3 m)
const G = 3;
const NGX = Math.ceil(SX / G), NGZ = Math.ceil(SZ / G);
const solid = new Uint8Array(NGX * NGZ);
function pointInPoly(px, pz, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, zi] = poly[i], [xj, zj] = poly[j];
    if (((zi > pz) !== (zj > pz)) && (px < (xj - xi) * (pz - zi) / (zj - zi) + xi)) inside = !inside;
  }
  return inside;
}
// rasterizza il footprint reale (non un cerchio attorno al centroide)
function markSolid(poly) {
  let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity;
  for (const [x, z] of poly) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); z0 = Math.min(z0, z); z1 = Math.max(z1, z); }
  const i0 = Math.max(0, Math.floor(x0 / G)), i1 = Math.min(NGX - 1, Math.floor(x1 / G));
  const j0 = Math.max(0, Math.floor(z0 / G)), j1 = Math.min(NGZ - 1, Math.floor(z1 / G));
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
    if (pointInPoly(i * G + G / 2, j * G + G / 2, poly)) solid[j * NGX + i] = 1;
  }
}

}

function instanced(geo, mat, listOf, mapFn) {
  const m = new THREE.InstancedMesh(geo, mat, listOf.length);
  const mtx = new THREE.Matrix4(), q = new THREE.Quaternion(), one = new THREE.Vector3(1, 1, 1);
  const fwd = new THREE.Vector3(0, 0, 1);
  listOf.forEach((it, i) => {
    const d = mapFn(it);
    q.setFromUnitVectors(fwd, new THREE.Vector3(d.nx, 0, d.nz).normalize());
    mtx.compose(new THREE.Vector3(d.x, d.y, d.z), q, one);
    m.setMatrixAt(i, mtx);
  });
  m.instanceMatrix.needsUpdate = true;
  return m;
}

function freeSpot(x0, z0) {
  const ok = (x, z) => {
    const i = Math.floor(x / G), j = Math.floor(z / G);
    if (i < 0 || j < 0 || i >= NGX || j >= NGZ) return false;
    return !solid[j * NGX + i];
  };
  if (ok(x0, z0)) return { x: x0, z: z0 };
  for (let r = G; r < 90; r += G) {
    for (let a = 0; a < 16; a++) {
      const th = (a / 16) * Math.PI * 2;
      const x = x0 + Math.cos(th) * r, z = z0 + Math.sin(th) * r;
      if (ok(x, z)) return { x, z };
    }
  }
  return { x: x0, z: z0 };
}

// ---------- camera orbit around player ----------
const view = { az: Math.atan2(-(DIR?.[0] ?? -1), -(DIR?.[1] ?? 0)), el: THREE.MathUtils.degToRad(58), dist: 5.0 };
function applyCam() {
  const target = new THREE.Vector3(P.x, hSample(P.x, P.z) + 3.2, P.z);
  const d = 6000;
  cam.position.set(
    target.x + d * Math.cos(view.el) * Math.cos(view.az),
    target.y + d * Math.sin(view.el),
    target.z + d * Math.cos(view.el) * Math.sin(view.az));
  cam.lookAt(target);
  const zoomF = view.dist / 5.0;
  const hw = 34 * zoomF;
  const aspect = innerWidth / innerHeight;
  const hh = Math.max(hw / aspect, 24 * zoomF);
  cam.left = -hw; cam.right = hw; cam.top = hh; cam.bottom = -hh;
  cam.updateProjectionMatrix();
}

const stick = document.getElementById('stick');

const move = { x: 0, y: 0 };
let stickId = null, sc0 = { x: 0, y: 0 };
stick.addEventListener('pointerdown', e => {
  stickId = e.pointerId; stick.setPointerCapture(stickId);
  const r = stick.getBoundingClientRect();
  sc0 = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  onStick(e);
});
function onStick(e) {
  const dx = e.clientX - sc0.x, dy = e.clientY - sc0.y;
  const R0 = 44;
  const len = Math.hypot(dx, dy);
  const k = len > R0 ? R0 / len : 1;
  const kx = dx * k, ky = dy * k;
  knob.style.transform = `translate(${kx}px, ${ky}px)`;
  move.x = kx / R0; move.y = ky / R0;
}
stick.addEventListener('pointermove', e => { if (e.pointerId === stickId) onStick(e); });
const endStick = e => {
  if (e.pointerId !== stickId) return;
  stickId = null; move.x = 0; move.y = 0;
  knob.style.transform = 'translate(0,0)';
};
stick.addEventListener('pointerup', endStick);
stick.addEventListener('pointercancel', endStick);

canvas.addEventListener('pointerdown', e => { touches.set(e.pointerId, { x: e.clientX, y: e.clientY }); });
canvas.addEventListener('pointermove', e => {
  if (!touches.has(e.pointerId)) return;
  touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const pts = [...touches.values()];
  if (pts.length === 2) {
    const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    if (pinchDist) view.dist = Math.max(1.6, Math.min(9.5, view.dist * (pinchDist / d)));
    pinchDist = d;
    dragId = null;
    applyCam();
  }
});
const drop = e => { touches.delete(e.pointerId); pinchDist = 0; };
canvas.addEventListener('pointerup', drop);
canvas.addEventListener('pointercancel', drop);
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  view.dist = Math.max(1.6, Math.min(9.5, view.dist * (1 + Math.sign(e.deltaY) * 0.1)));
  applyCam();
}, { passive: false });

// tastiera (desktop)
const keys = {};
addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

// ---------- temi ----------
const THEMES = {
  day: { bg: '#dce9ee', hemiSky: '#eaf2ff', hemiGnd: '#c9b79a', hemiI: 1.5,
         sunC: '#fff2d8', sunI: 2.1, sea: '#8ec4d8', winI: 0, az: 2.2, el: 0.9, exp: 1.02 },
  dusk: { bg: '#f0d3b4', hemiSky: '#ffd9b0', hemiGnd: '#a98a6c', hemiI: 1.15,
          sunC: '#ff9d5c', sunI: 2.0, sea: '#7a9fb5', winI: 0.5, az: 0.6, el: 0.28, exp: 1.05 },
  night: { bg: '#232c40', hemiSky: '#9db1d6', hemiGnd: '#54596a', hemiI: 1.05,
           sunC: '#a8bedf', sunI: 0.85, sea: '#2f4f73', seaEm: '#16283f', winI: 0.95, az: -1.2, el: 0.7, exp: 1.14 },
};
function applyTheme(name) {
  const t = THEMES[name];
  scene.background = new THREE.Color(t.bg);
  hemi.color = new THREE.Color(t.hemiSky);
  hemi.groundColor = new THREE.Color(t.hemiGnd);
  hemi.intensity = t.hemiI;
  sun.color = new THREE.Color(t.sunC);
  sun.intensity = t.sunI;
  seaMat.color = new THREE.Color(t.sea);
  seaMat.emissive = new THREE.Color(t.seaEm || '#000000');
  plinthMat.color = new THREE.Color(name === 'night' ? '#4c3f33' : name === 'dusk' ? '#a58364' : '#b99a76');
  winMat.emissiveIntensity = t.winI;
  renderer.toneMappingExposure = t.exp;
  document.body.classList.toggle('night', name === 'night');
  document.querySelectorAll('#bar button[data-t]').forEach(b => b.classList.toggle('on', b.dataset.t === name));
  window.__themeAz = t.az;
  window.__themeEl = t.el;
}
document.querySelectorAll('#bar button[data-t]').forEach(b => b.onclick = () => {
  applyTheme(b.dataset.t);
  view.az = window.__themeAz;
  applyCam();
});
let season = 'summer';
document.querySelector('#bar button[data-s]').onclick = (e) => {
  season = season === 'summer' ? 'autumn' : 'summer';
  if (window.__leafMat) window.__leafMat.color = new THREE.Color(season === 'autumn' ? '#c58a45' : '#6e9159');
  e.target.style.background = season === 'autumn' ? 'rgba(200,140,70,.55)' : '';
};

// ---------- loop ----------
const clock = new THREE.Clock();
let tAcc = 0;
function frame() {
  const dt = Math.min(0.05, clock.getDelta());

  // input
  let ix = move.x, iy = move.y;
  if (keys['w'] || keys['arrowup']) iy -= 1;
  if (keys['s'] || keys['arrowdown']) iy += 1;
  if (keys['a'] || keys['arrowleft']) ix -= 1;
  if (keys['d'] || keys['arrowright']) ix += 1;
  const mag = Math.hypot(ix, iy);
  if (mag > 1) { ix /= mag; iy /= mag; }

  if (mag > 0.05) {
    // direzione relativa alla camera
    const ca = Math.cos(view.az), sa = Math.sin(view.az);
    const fx = -ca, fz = -sa;      // avanti (verso il centro dello schermo)
    const rx = -sa, rz = ca;       // destra
    let dx = fx * (-iy) + rx * ix;
    let dz = fz * (-iy) + rz * ix;
    const dl = Math.hypot(dx, dz) || 1;
    const speed = 13.5 * Math.min(1, mag);
    const nx = P.x + (dx / dl) * speed * dt;
    const nz = P.z + (dz / dl) * speed * dt;
    const cell = (x, z) => {
      const i = Math.floor(x / G), j = Math.floor(z / G);
      if (i < 0 || j < 0 || i >= NGX || j >= NGZ) return 1;
      return solid[j * NGX + i];
    };
    if (!cell(nx, nz)) { P.x = nx; P.z = nz; }
    else if (!cell(nx, P.z)) P.x = nx;
    else if (!cell(P.x, nz)) P.z = nz;
    P.walk += dt * 11;
    P.yaw = Math.atan2(dx, dz);
  } else {
    P.walk += dt * 1.2;
  }

  const gy = hSample(P.x, P.z);
  player.position.set(P.x, gy, P.z);
  player.rotation.y = P.yaw;
  const sw = mag > 0.05 ? Math.sin(P.walk) * 0.6 : 0;
  legL.rotation.x = sw; legR.rotation.x = -sw;
  bTorso.position.y = 1.35 + (mag > 0.05 ? Math.abs(Math.sin(P.walk)) * 0.05 : Math.sin(P.walk * 0.6) * 0.015);

  // sole che segue il giocatore (ombre nitide intorno a lui)
  const t2 = performance.now() / 1000;
  const az = (window.__themeAz ?? 2.2);
  const elev = (window.__themeEl ?? 0.72);
  const dist = 760;
  sun.position.set(P.x + dist * Math.cos(elev) * Math.cos(az), dist * Math.sin(elev), P.z + dist * Math.cos(elev) * Math.sin(az));
  sun.target.position.set(P.x, 0, P.z);
  sun.target.updateMatrixWorld();

  applyCam();
  renderer.render(scene, cam);
  requestAnimationFrame(frame);
}

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight, false);
  applyCam();
});

applyTheme('day');
applyCam();
requestAnimationFrame(frame);
window.__ready = true;
window.__debug = { P, view, applyCam };
</script>
</body>
</html>
